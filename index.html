<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tempreture Converter</title>
    <link rel="stylesheet" href="style.css">
<link rel="shortcut icon" href="./assets/favicon.png" type="image/x-icon">
    <!-- tailwind and daisy ui -->
     <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

<!-- font  -->
 <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

</head>
<body class="inter-font flex justify-center items-center w-full min-h-screen">


<div class="container shadow-md rounded-sm border-1 border-gray-600 max-w-200 min-h-50 grid content-center items-center  p-10 border">


    <div class="content text-lg mb-2">
        <h2 class="font-bold text-2xl">Tempreture Converter</h2>
        <p>Enter the tempreture, Select the unit and submit</p>
    </div>

    <div class="flex  items-center">

        <div class="inputs flex flex-row gap-1 items-center">
            <input placeholder="enter unit" id="input-value" class="p-2 rounded-md border-1 border-gray-400" type="text">
            <select class="p-2 border-1 border-gray-400 rounded-md" name="" id="from_unit">
                <option value="F">
                    Fahrenheit
                </option>
                <option value="C">
                    Celseus
                </option>
                <option value="K">
                   kelvin
                </option>
            </select>
            
            <select class="border-1 border-gray-400 rounded-md p-2" name="" id="to_unit">
                <option value="F">
                    Fahrenheit
                </option>
                <option value="C">
                    Celseus
                </option>
                <option value="K">
                   kelvin
                </option>
            </select>
            <button onclick="convert()" class="px-4 p-2 btn btn-neutral">Convert</button>
        </div>
    </div>
    <div class="" id="result-box">

    </div>

</div>

    <script src="script.js"></script>
    
</body>
</html>
